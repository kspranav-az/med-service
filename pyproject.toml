[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "med-service"
version = "0.1.0"
description = "Medical-domain AI toolkit: RAG Chat Agent + Semantic Autocomplete"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API & data models
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",

    # Infrastructure clients
    "qdrant-client>=1.18.0,<2.0.0",
    "redis>=5.2.0",

    # Utilities
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "numpy<2.0",

    # Observability
    "langfuse>=2.53.0",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.2.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "pypdf>=5.1.0",
    "pymupdf>=1.24.0",
    # Optional high-quality layout-preserving parser (heavy, downloads models on first run)
    "marker-pdf>=1.0.0",
    # LLM clients for RAG generation
    "openai>=1.50.0",
    "anthropic>=0.40.0",
]

autocomplete = [
    "scispacy>=0.5.4",
    "spacy>=3.7.0,<3.8.0",
    "rapidfuzz>=3.0.0",
]

eval = [
    "langfuse>=2.53.0",
    # NOTE: ragas will be added in Phase 3; current versions have langchain
    # compatibility issues that are best resolved closer to integration time.
]

all = [
    "med-service[rag,autocomplete,eval]",
]

[project.scripts]
ingest-pdfs = "scripts.ingest_pdfs:main"
reindex-source = "scripts.reindex_source:main"
reindex-all = "scripts.reindex_all:main"
extract-entities = "scripts.extract_entities:main"
index-entities = "scripts.index_entities:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.29.0",
    "jupyter>=1.1.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["shared*", "services*", "scripts*", "tests*"]
exclude = ["data*", "phases*", "notebooks*", "qdrant_storage*", "redis_data*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
