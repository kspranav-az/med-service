# Single-container Docker Compose for MedService inference.
#
# Usage:
#   docker compose -f docker-compose.med-service.yml up -d
#
# This stack runs Qdrant + Redis + one container that hosts both FastAPI services.
# Mount your pre-built data/ and qdrant_storage/ directories from the host.
# Set CORS_ORIGINS and LLM keys in a .env file before starting.

services:
  med-qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: med-service-qdrant
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped

  med-redis:
    image: redis:7-alpine
    container_name: med-service-redis
    restart: unless-stopped

  med-service:
    build: .
    container_name: med-service
    env_file: .env
    environment:
      QDRANT_URL: http://med-qdrant:6333
      REDIS_URL: redis://med-redis:6379/0
    volumes:
      - ./data:/app/data:ro
      - med-cache:/app/.cache
    depends_on:
      - med-qdrant
      - med-redis
    restart: unless-stopped
    # The container listens on 8100/8101 internally. We still expose the
    # familiar 8000/8001 on localhost for local development so the frontend
    # defaults keep working. On a shared server, remove these host ports and
    # route through the existing reverse proxy (see docker-compose.med-service.deploy.yml).
    ports:
      - "127.0.0.1:8000:8100"
      - "127.0.0.1:8001:8101"

volumes:
  med-cache:
